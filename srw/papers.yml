- abstract: Multi-agent large language model (LLM) frameworks have shown promise in automating requirements
    engineering (RE), where specialised agents collaborate to transform informal stakeholder descriptions
    into structured Software Requirements Specifications. However, existing frameworks typically rely
    on fixed, hand-coded action schedules that cannot adapt to the evolving state of generated requirements
    artefacts. We propose a reinforcement learning (RL)-driven orchestration framework in which a Proximal
    Policy Optimisation (PPO) policy dynamically selects agent actions based on a compact representation
    of the shared document workspace. The framework also introduces a dedicated Negotiator agent for conflict
    identification, resolution, and requirement prioritisation. To guide policy learning, a grounded oracle
    based on sentence-embedding cosine similarity provides reward signals instead of LLM self-reported
    quality scores. Paired evaluation across 22 scenarios spanning 14 software domains shows that the
    proposed framework achieves a higher mean oracle reward than a fixed-schedule baseline (0.630 vs.
    0.574; Cohen's $d = 1.11$, $p < 0.001$). Requirements precision improves by a mean absolute difference
    of 0.269 across the paired scenarios ($d = 2.12$, $p < 0.0001$), while coverage is fully preserved.
    A controlled ablation further shows that the Negotiator's hand-specified action set improves conflict
    handling ($d = 1.23$, $p < 0.0001$), without measurable reductions in coverage, precision, or non-functional
    requirements coverage. These findings suggest that RL-driven agent orchestration can improve oracle-aligned
    requirements generation and conflict handling while maintaining requirements coverage.
