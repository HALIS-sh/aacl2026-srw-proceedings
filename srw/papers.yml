- abstract: Voting-based retrieval-augmented generation (RAG) generates one answer candidate from each
    retrieved passage and selects a final answer by plurality voting. Because conventional voting-based
    RAG treats all answer candidates equally, the same incorrect answer generated from multiple passages
    can receive the most votes and be selected as the final answer. To reduce the influence of such repeated
    incorrect answers, we propose confidence-based answer candidate filtering for voting-based RAG (ConFiVote).
    ConFiVote is motivated by the hypothesis that signals obtained during answer generation can help distinguish
    incorrect candidates from correct ones. Therefore, ConFiVote uses an answer candidate classifier to
    assign each candidate a confidence score based on these signals. Candidates with scores below a threshold
    are removed before plurality voting, aiming to increase the relative share of votes supporting correct
    answers. Experiments on AI-O 2.0, a Japanese factoid question-answering dataset, show that ConFiVote
    improves final-answer accuracy over unfiltered voting for all three evaluated LLMs, with gains of
    12.9, 5.3, and 4.2 percentage points for Qwen, Swallow, and llm-jp, respectively.
