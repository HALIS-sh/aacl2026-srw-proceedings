- abstract: "Metaphorical language remains a major challenge for multilingual natural language processing\
    \ because successful interpretation and translation require reasoning beyond literal lexical meaning.\
    \ Existing research has largely investigated metaphor detection, machine translation, and translation\
    \ evaluation as separate tasks, while little work has explored how these components can be integrated\
    \ into a unified computational framework. This PhD proposal aims to develop an end-to-end framework\
    \ for multilingual metaphor processing consisting of three complementary research directions: (1)\
    \ robust metaphor detection across languages, (2) metaphor-oriented translation evaluation for both\
    \ human assessment and automatic quality estimation, and (3) joint modelling that connects metaphor\
    \ detection with translation evaluation. The proposed research will combine linguistic theory with\
    \ recent advances in large language models to develop new datasets, annotation methodologies, evaluation\
    \ benchmarks, and automatic evaluation approaches for metaphor-aware machine translation. The expected\
    \ outcome is a unified framework that improves both the development and evaluation of multilingual\
    \ NLP systems when processing figurative language. Resources will be shared publicly at \n\\url{https://github.com/Jiahui84/Metaphor_end2end}"
