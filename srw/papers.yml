- abstract: Instruction-based fine-tuning for aspect sentiment quadruple prediction (ASQP) offers a flexible,
    end-to-end framework for fine-grained sentiment analysis but the effective use of adversarial training
    in this task remains underexplored. This study investigates how the perturbation scope, perturbation
    strength, and the optimization steps affect instruction-based ASQP with T5-base and BART-base models.
    We compare global, aspect-only, opinion-only, and aspect-opinion perturbations while exploring the
    effects of perturbation radius, adversarial loss weight, and one-step versus multiple-step attack.
    The experimental results indicate that aspect-only perturbation provides the strongest validation-selected
    configuration for both backbones, while one-step FGM consistently outperforms the multiple-step PGD
    attack under the optimal configuration. On the test set, the optimal adversarial training configurations
    improve item micro-F1 from 0.8176 to 0.8313 for T5-base and from 0.6643 to 0.6811 for BART-base, with
    the gains primarily driven by higher recall. These findings show that an effective adversarial perturbation
    attack for instruction-based ASQP depends on both the perturbation scope and the perturbation strength,
    and that stronger iterative optimization steps do not yield better performance.
