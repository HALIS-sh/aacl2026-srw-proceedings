- abstract: Automatic Speech Recognition (ASR) for Indian languages has recently evolved from specialized
    encoder-decoder and Connectionist Temporal Classification (CTC)-based architectures toward large audio-language
    models (LALMs). However, the robustness and comparative effectiveness of these model families for
    multilingual Indian language ASR remain underexplored. In this paper, we present a systematic evaluation
    of eight ASR models across Assamese, Bengali, Hindi, and Odia using the speaker-disjoint IndicVoices
    dataset. Our benchmark includes four traditional transformer-based ASR architectures and four LALMs.
    Among all evaluated systems, IndicConformer-600M evaluated without fine-tuning achieves the strongest
    overall performance, attaining the lowest per-language word error rate (WER) and character error rate
    (CER) on all four languages. We report it as an in-domain reference and not as a matched baseline.
    Among the fine-tuned LALMs, Phi-4-Multimodal-Instruct performs best, attaining the lowest per-language
    WER and CER on three of the four languages (Assamese, Bengali, and Odia), and surpassing the strongest
    fine-tuned traditional baseline, MMS-1B-All, on WER in all four languages. Qwen2-Audio-7B-Instruct
    and Voxtral-Mini-3B-2507 achieve competitive WERs, while Qwen3-ASR-1.7B shows comparatively weaker
    final performance. Our findings indicate that fine-tuned LALMs are competitive with traditional ASR
    models in this low-resource setting, although specialized Indian-language ASR checkpoints may continue
    to maintain a substantial performance advantage.
