- abstract: Frontier Large Language Models (LLMs) are predominantly optimized for high-resource languages,
    leaving low-resource scripts like Khmer vulnerable to ``language bleeding''---the unprompted intrusion
    of foreign lexical tokens, Latin script, or dominant-language syntactic structures into output text.
    In this work, we explore a localized training pipeline for a compact 100-million-parameter Khmer language
    model that combines Khmer-specialized tokenization with purity-constrained data curation and supervised
    fine-tuning. On a targeted 201-question Khmer historical and regional QA benchmark, Bayon achieves
    a Language Bleed Ratio (LBR) of 0.06\%, while obtaining 15 correct answers compared with 4 for the
    0.5B-parameter Qwen2.5-Instruct baseline. We further observe substantially shorter tokenized sequences
    for Bayon on three illustrative Khmer passages, with 1.65$\times$ to 4.49$\times$ fewer tokens than
    the comparison tokenizers. These results provide preliminary evidence that language-focused specialization
    can enable compact models to produce highly script-consistent Khmer output under limited compute.
    Importantly, low LBR measures script purity rather than overall Khmer generation quality; we therefore
    treat language bleeding and task accuracy as complementary evaluation dimensions.
