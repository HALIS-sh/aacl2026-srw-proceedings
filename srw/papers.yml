- abstract: "Discourse parsing based on Segmented Discourse Representation Theory (SDRT) is crucial for\
    \ capturing the structural dynamics of dialogues.\nHowever, most prior research focuses on English,\
    \ and its effectiveness for Japanese remains unclear owing to the lack of Japanese SDRT corpora.\n\
    To address this issue, we construct Japanese SDRT corpora by translating existing English SDRT corpora\
    \ using an LLM.\nThrough a comparative evaluation of prompt-based and fine-tuned LLMs, we show that\
    \ the models achieve comparable performance between English and Japanese, suggesting the cross-lingual\
    \ applicability of SDRT-based discourse parsing.\nIn order to investigate why the English and Japanese\
    \ parsers achieve similar performance, we conduct ablation analyses on discourse markers and contextual\
    \ inputs. \nOur results reveal that most of the Japanese discourse markers we examined have little\
    \ impact, and the models' predictions depend heavily on contextual discourse relations rather than\
    \ on the content of the context clauses.\nThis structural reliance might explain the comparable performance\
    \ despite the substantial typological differences between English and Japanese."
