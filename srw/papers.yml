- abstract: 'We examine how a training corpus''s bias transfers to a model fine-tuned on it. We fine-tune
    Llama 3.2 3B Instruct on four corpora spanning a bias range: partisan NELA-GT news, its high-bias
    filtered subset in NELA-GT-HB, auto-generated NELA-PS content, and Wikipedia articles on US high schools.
    We evaluate the five models on 1,500 completions (300 each, across 15 prompts). Bias is scored per-completion
    by an LLM-as-Judge and via WEAT. Fine-tuning on NELA-GT raises mean bias above base, with largest
    shifts on climate and immigration. NELA-GT-HB raises this further. Fine-tuning on NELA-PS reduces
    output bias. However, Wikipedia fine-tuning produces the highest raw mean output bias and the largest
    WEAT effect sizes, despite the low bias score of the corpus. Wiki is the only condition that hallucinates
    at an abnormal rate. Correcting for the judge''s false-positive rate, 36.9% of Wiki''s completions
    include fabricated laws, policies, or officials. We primarily attribute this paradox to hallucination
    inflation, compounded by an overfit condition on a small corpus and amplification of pre-existing
    biases. These results indicate that corpus-level bias scores are not reliable predictors of fine-tuned
    model bias, and that LLM-as-Judge evaluations of bias risk conflating factual accuracy with actual
    bias in models that hallucinate more.'
