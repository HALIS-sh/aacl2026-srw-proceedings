- abstract: 'Machine unlearning is usually judged by whether a model stops producing the target answer,
    and by this measure it works. Yet removal is fragile: a paraphrased query, a few unrelated fine-tuning
    steps, or quantisation often bring the answer back. We propose an account that fits this and several
    published findings. A model may support a fact with several sufficient computations, that is, sets
    of internal units (components, features, or directions) each able to produce the answer on its own.
    Unlearning is trained on a narrow forget set, so it suppresses only the computation that set uses,
    while the others keep working. This thesis tests the account with mechanistic interpretability tools.
    The core research questions ask whether the sufficient computations for a fact share few units, whether
    paraphrases of the same question rely on different units, and whether these properties, measured before
    unlearning, predict how easily the fact comes back afterwards. Two extensions ask how many paraphrases
    unlearning must cover to be robust, and whether unlearning weakens refusal in proportion to what facts
    and refusal share. The account is refuted if the sufficient computations found for a fact always overlap
    heavily, or if all paraphrases rely on the same units.'
