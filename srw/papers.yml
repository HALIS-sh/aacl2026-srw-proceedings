- abstract: Next utterance class prediction provides an explicit policy decision before response generation
    in a dialogue agent. This capability supports a client agent for novice counselor training and a future
    counselor agent for intake interview support. A preceding experiment showed that acoustic information
    improved aggregate prediction accuracy, but the source of that improvement remained unclear. This
    study analyzes paired predictions without audio and with audio for eight counselor patterns and seven
    independently selected client patterns across seven acoustic features. The analysis workbook contains
    the complete pooled evaluation data from cross-validation, comprising 10,371 counselor target instances
    and 10,377 client target instances. The selected patterns preserve the aggregate accuracy trend, with
    gains of 22.94 percentage points for counselor prediction and 13.69 percentage points for client prediction.
    Counselor accuracy with audio varies strongly across duration and final-syllable F0 slope, while client
    accuracy is nearly uniform across the seven features. Accuracy stratification identifies the acoustic
    ranges in which the improvement is concentrated. These findings clarify how acoustic information can
    support class controlled counseling agents and define the analyses required for confirmation on original
    session data.
