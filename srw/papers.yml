- abstract: 'Emergent misalignment (EM) is a phenomenon where language models broadly generalize undesirable
    behavior after finetuning on a narrow set of harmful examples such as insecure code. This exposes
    gaps in our understanding of generalization and raises practical safety concerns. We study this phenomenon
    through the lens of uncertainty quantification. Although EM models show markedly higher uncertainty
    than the base checkpoint, control models finetuned on benign data show similarly elevated uncertainty,
    suggesting that uncertainty magnitude reflects domain shift rather than alignment properties. Instead,
    we find that EM models exhibit a characteristic dynamic signature: increased lag-1 autocorrelation
    of token-wise entropies. We interpret this as evidence of high-level uncertainty over aligned versus
    misaligned behavior, as opposed to low-level variation such as choosing among semantically equivalent
    phrasings.'
