- abstract: Developmental language disorder is a common childhood condition of unknown origin, identified
    by ruling other causes out rather than by a positive test. A growing body of machine-learning research
    addresses its automatic identification. Instead of training another classifier, we repurpose a self-supervised
    speech model as a measurement instrument, and ask through concept erasure whether it uses a developmental
    dimension or merely encodes it. Readings are anchored to validated markers, and acquisition is controlled
    at the source. Calibration on public child speech under a five-part validity protocol needs no labels
    and is already under way. We then read it on 243 recordings from 102 French-speaking children, where
    identification waits on the release of the cohort's diagnostic labels. The first design reads what
    the clinical literature already knows. The second removes the validated marker from a raw-signal model
    and asks what still carries the decision. Finally, we test the markers outside the language and the
    cohort they were built on. Whichever design is used, we report accuracy beside the degradation after
    erasure, so a clinician sees not only how a reading performs but whether it rests on the intended
    dimension.
