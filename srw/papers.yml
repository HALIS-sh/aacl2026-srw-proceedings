- abstract: 'Multiple-choice accuracy alone may provide an incomplete assessment of Large Language Models
    (LLMs) on Thai cultural knowledge because selecting the expected answer does not reveal the quality
    or consistency of the model’s justification. We introduce E-MCQ, a 200-item, expert-reviewed benchmark
    for Thai social norms and beliefs that requires both answer selection and natural-language explanation
    generation. We evaluate eight open-weight LLMs (≤9B parameters) across general-purpose, Southeast
    Asian multilingual, and Thai-specialized model groups. Southeast Asian multilingual models achieve
    the highest average Exact Match score, exceeding the general-purpose baselines by 10.1 percentage
    points, while Thai-specialized models obtain the highest average LLM-as-Judge score. However, performance
    varies substantially across individual systems: Sailor2-8B achieves the highest score on both answer
    selection and explanation evaluation, while several models combine competitive answer accuracy with
    incoherent, unsupported, or answer-inconsistent explanations. These results show that answer accuracy
    alone does not fully characterize model performance on Thai cultural knowledge.'
