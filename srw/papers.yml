- abstract: 'Financial documents like invoices, receipts, and multi-page filings are hard for AI systems
    to read correctly. They mix text, numbers, tables, and layouts, and the meaning of a value often depends
    on other parts of the document - for example, a number only makes sense once you know which row, column,
    and currency it belongs to. Current models such as LayoutLM and its successors read text, layout,
    and images together, but they treat a document as a flat sequence of tokens. This makes them good
    at labeling individual pieces of information but weak at connecting related pieces, especially when
    that information is spread across multiple pages. Graph-based methods try to fix this by explicitly
    linking related entities, but most of them only work within a single page and have rarely been tested
    on financial documents. Combining both ideas, this thesis aims to propose CPRG-Net (Cross-Page Relational
    Graph Network): a multimodal model that reads text, layout, and images, together with a graph-based
    component that explicitly links related information, including across page boundaries. The goal is
    to build a system that extracts information from financial documents more accurately than existing
    multimodal-only or graph-only methods, and to understand exactly when and why adding this relational
    structure actually helps.'
