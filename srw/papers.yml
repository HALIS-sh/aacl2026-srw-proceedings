- abstract: 'Hindi encodes honorific level through pronouns (aap/tum/tu) and verb agreement. We ask whether
    Gemma-2-2B represents this level before any such marker appears, and whether public Gemma Scope SAEs
    expose a feature that captures it. We build a 600-pair contrastive Hindi set with a context-only,
    pre-marker condition: the input describes the social setting but contains no second-person pronoun
    or agreement-bearing form. On this condition, a linear probe on a middle layer reaches AUROC 0.722,
    against 0.610 for word TF–IDF, 0.550 for character n-grams, and 0.535 at layer 0. The signal holds
    with addressee roles held out (0.692) and on naturalistic prefixes (0.655). Because the contexts state
    the speaker–addressee relation, and the probe is binary (aap versus tum/tu), this shows that register-relevant
    social context is linearly decodable, not that the model holds a dedicated honorific variable.


    The SAE analysis is negative. At layer 2, none of 50 candidates ranked by raw effect size passes our
    prespecified pronoun-specificity audit, and an exploratory five-prompt intervention on the top candidate
    shows no dose response or necessity. We therefore frame the work as a probing and negative-results
    study: it does not localise honorific information in the SAE dictionary or identify a causal handle.
    We release the dataset, rubric, and a single-GPU pipeline.'
