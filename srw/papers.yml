- abstract: 'Negotiation agents must choose actions that advance agreement and realize them as appropriate
    utterances.  Dialogue-act-based systems separate strategy from surface realization, whereas large
    language models (LLMs) enable flexible generation.  We present DAMF, which integrates an LLM into
    a parser--manager--generator framework: the manager selects a response dialogue act, a rule-based
    selector supplies a price when needed, and the LLM realizes the act in context.  We compare DAMF with
    three baselines in a randomized, blinded within-participant study (11 participants; four agents $\times$
    two roles) and a complete $4\times4$ agent--agent evaluation over 100 shared scenarios per ordered
    pairing.  With human partners, DAMF attained the highest pooled agreement rate and mean utility and
    led four of five dialogue-quality means.  Confirmed differences were higher buyer-role ratings than
    All for non-robotic phrasing and strategic communication ($p=.012$ each); no role-specific quantitative
    difference was significant.  In automated negotiation, DAMF exceeded Simple and All in agreement and
    utility in both roles and achieved higher seller utility than Search.  Together, the evaluations demonstrate
    DAMF''s viability as an inspectable modular design for LLM-based negotiation.'
