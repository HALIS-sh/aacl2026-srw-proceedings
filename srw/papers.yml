- abstract: Traditional sentiment analysis reduces consumer affect to singular polarity scores, obscuring
    the specific experiencer and causal mechanisms of an emotion. This paper introduces Emotion Quadruplet
    Extraction (EQE), a joint task extracting the Emotion, Emotion Cause Object, Emotion Cause Action,
    and Emotion Experiencer. Grounded in cognitive appraisal theory, EQE advances beyond monolithic cause-extraction
    paradigms by bifurcating the causal antecedent into a target object and its situational action. To
    support this, a span-level annotated product-review corpus, EmoReview, is introduced. We formulate
    the task as an instruction-guided generation utilizing a T5 encoder-decoder initialized with Aspect-Based
    Sentiment Analysis (ABSA) weights. Experiments reveal that zero-shot frontier models (e.g., GPT-4o-mini,
    Gemini 3.1 Flash-Lite) fail to generate valid structural spans. Conversely, emotion-anchored finetuning
    of the ABSA-primed model raises overall F1 from 0.007 to 0.248, outperforming zero-shot decoders.
    Our findings identify Cause Action extraction as the primary bottleneck, exposing a concrete challenge
    for future fine-grained emotion analysis and understanding.
