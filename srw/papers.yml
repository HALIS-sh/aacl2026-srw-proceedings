- abstract: 'LLM-based patient simulators for therapist training remain "too cooperative": they accept
    therapist reframings too readily and lose the cognitive rigidity that defines real depressive presentations.
    We ask whether theory-derived, attention-level interventions can restore this rigidity. We translate
    the operational definitions of selective attention bias (Mathews & MacLeod, 2005) and rumination (Nolen-Hoeksema,
    1991) into two hooks on transformer attention: a pre-softmax logit boost on negative-valence keys,
    and a stateful attention-history accumulator that forms self-reinforcing attractors around negative
    content. A three-metric behavioural framework (CNS, CRD, TPI), construct-validated on a Patient-$\Psi$-derived
    corpus and cross-validated on real clinical interviews (DAIC-WOZ; AUC up to $0.84$, Spearman $\rho=0.58$
    with PHQ-8), detects a pre-registered double dissociation across three model families and two alignment
    regimes: the selective-attention hook drives counter-reframing (mean Cohen''s $d=1.74$) while leaving
    topic persistence flat, and the rumination hook drives topic persistence (mean $d=1.92$) while leaving
    counter-reframing flat. The effects are not reproduced by prompt- or output-level steering baselines,
    including a behaviour-matched prompt that explicitly instructs both target behaviours; they localize
    to a sparse subset of mid-to-late attention heads (causal on/off ratio $4.8\times$), and are corroborated
    by blind ratings from licensed therapists ($p<0.05$ vs. Patient-$\Psi$ on all rated dimensions).'
