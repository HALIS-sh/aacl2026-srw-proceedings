- abstract: The scientific peer-review process faces increasing human costs as submission volumes continue
    to grow. Prior work has proposed interpretable argument-based metrics for evaluating review substantiation.
    In particular, SubstanScore multiplies supported\_claims, the proportion of claims accompanied by
    evidence, by review length. However, it remains unclear whether its predictive performance reflects
    substantive review quality, claim-evidence structure, or review length. We investigate this question
    from two perspectives. First, we introduce WarrantScore, a minimal extension of SubstanScore that
    evaluates the implicit reasoning connecting claims and evidence. On two human-annotated datasets,
    WarrantScore showed slightly higher correlations with human judgments, but the differences were not
    statistically significant, providing no clear evidence that warrant evaluation adds predictive value
    under the current formulation. Second, we isolate supported\_claims and examine whether it distinguishes
    sufficient from deficient reviews while remaining stable when redundant text is added. The proportion
    of claims accompanied by evidence was less affected by artificial review elongation than the full
    length-weighted score and surface linguistic features, while retaining some ability to distinguish
    sufficient from deficient reviews. Overall, these findings suggest that argument-structure features
    may capture substantive aspects of review quality while remaining less sensitive to review length,
    thereby providing a more length-robust basis for review evaluation.
