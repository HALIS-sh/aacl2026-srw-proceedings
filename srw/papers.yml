- abstract: Interpretability is important for sentiment polarity classification of social media posts.
    Predictions can hinge on a small set of cues, and explanations should remain stable under minor edits.
    In Japanese, inflection changes word forms, and word boundaries can be unclear. These factors complicate
    word-level alignment and evaluation. In this paper, we study interpretability evaluation for Japanese
    sentiment polarity classification on WRIME. At the word level, we compare attention-based attribution,
    Integrated Gradients, and LIME. We evaluate plausibility with Token-F1, ranking consistency with exact-match
    and lemma-based variants of mean average precision (MAP), and faithfulness with Sufficiency and Comprehensiveness.
    We train an aspect–opinion span extractor and use the predicted span sets to reweight token importance
    scores. Lexicon fusion and set-based weighting improve Token-F1 over Raw across the nine model–explainer
    combinations, with neighborhood weighting achieving the highest Token-F1 among the main settings.
    Set-based weighting has lower Exact MAP than lexicon fusion for every model–explainer pair, and faithfulness
    does not improve uniformly. Uniform-set is competitive, while the Oracle upper bound identifies span
    extraction quality as a limiting factor. Lemma MAP consistently exceeds Exact MAP, indicating that
    inflectional variation can lower scores under exact string matching. The implementation code is available
    at https://github.com/UweWei/Interpretability-Japanese-Sentiment.
