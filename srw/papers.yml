- abstract: Languages can identify subjects and objects through both morphological realization and linear
    position, but standard corpus measures often conflate an abstract morphological analysis with a cue
    that is actually visible in the word string. We introduce a held-out, lexical-free diagnostic of morphology–order
    cue allocation. From 20 typologically diverse Universal Dependencies 2.18 treebanks, we extract transitive
    clauses with one overt nominal subject and object, fit separate role decoders on official training
    splits, and evaluate on development and test data. One decoder sees positional features; a conventional
    upper-bound decoder sees gold CASE; and a realization-aware decoder sees only lemma-to-form edit signatures
    and overt nominal markers, never content-word forms, lemmas, stems, or gold CASE. Eighteen treebanks
    from 14 families meet data thresholds (34,719 training and 9,134 evaluation clauses). Realized-morphology
    and positional information gains are strongly inversely associated ($\rho = -.75$, permutation $p
    < .001$), with the result surviving family aggregation and every leave-one-treebank-out analysis.
    Gold CASE gain also trades off with position, but correlates weakly with realized-morphology gain
    ($\rho = .22$, $p = .385$). The findings support cross-linguistic cue allocation while showing that
    abstract case tags are not interchangeable with surface evidence.
