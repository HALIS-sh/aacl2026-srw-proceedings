- abstract: 'We define a task for AI meme idea generation, separate from template selection and image
    synthesis.

    We use three open-weight large language models (LLMs) to generate ideas in the style of Reddit memes
    and classify them as AI- or human-generated.

    Without fine-tuning, LLMs are poor or only fair discriminators, but supervised classifiers reach 93
    accuracy and F1.

    AI-generated ideas focused on workplace and technology tropes, making detection easy (for now). Our
    code is available at https://github.com/shineef/Meme-Identification.'
