- abstract: 'Dense retrieval can retrieve relevant text efficiently, but attribute-specific

    value extraction is often left to a computationally expensive neural reader or

    generator invoked after retrieval. We study an alternative that replaces this

    post-retrieval answer-readout stage: embedding text-derived knowledge graphs as

    algebraic retrieval objects, where graph matching is expressed through sums of

    Kronecker products and answer values are read out directly from the learned

    representation. On WikiNLDB-derived graphs, our prototype with query/fact

    encoders, maximal coding rate reduction (MCR2) regularization,

    and projected retrieval/readout reaches 0.888 fact F1 and 0.614 answer F1 on

    the training split, compared with 0.803 and 0.549 without

    MCR2. Robustness probes show

    sensitivity to graph construction choices: predicate-centered to direct-edge

    rewrites reduce fact F1 from 0.818 to 0.346 and answer F1 from 0.839 to 0.299.

    We also identify a redundancy bias in additive dot-product graph scoring and

    show that weighted coding-rate scoring partially reduces it, improving the

    post-rewrite fact F1 from 0.346 to 0.463. In a 40-query post-preparation

    latency pilot, support retrieval and direct answer readout take

    1.82 and 0.94 ms/query, respectively. These results support dense retrieval

    over knowledge graphs with direct value extraction while clarifying the

    representational and scoring challenges that remain.'
