- abstract: Large language models (LLMs) have become increasingly capable of processing informal language,
    yet their interpretation and alignment of sarcastic slang with humans remain underexplored. This study
    introduces SLANGCASTIC, a fine-grained English dataset comprising 200 tweets embedded with Generation
    Z sarcastic and non-sarcastic slang, annotated by eight human raters for sarcasm and sentiment. We
    evaluate six LLMs (GPT-4.1, GPT-5.1, GPT-OSS-20B, GPT-OSS-120B, Gemini-2.5-Flash, and Gemini-2.5-Pro)
    and compare their ratings with those of human annotators. Findings reveal that while newer models,
    such as GPT-5.1, show high overall agreement with humans, they all systematically over-annotate sarcasm
    and assign more negative sentiment. Qualitative analysis suggests this discrepancy arises because
    LLMs tend to over-reason and overanalyze semantic details. In contrast, human annotators rely on holistic,
    pragmatic reasoning to infer the speaker’s true intent. Therefore, the findings suggest that LLM-based
    moderation systems should account for cultural and contextual understanding when interpreting slang
    rather than relying solely on surface-level cues.
