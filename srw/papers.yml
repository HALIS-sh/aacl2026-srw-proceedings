- abstract: 'As AI systems increasingly mediate communication across languages and

    cultures, preserving literal meaning is not sufficient for preserving

    communicative intent. Expressions involving humor, sarcasm, social

    register, and cultural conventions can retain their propositional

    content while losing the meaning that makes them appropriate in context.

    We investigate this challenge through cross-lingual caption localization,

    using it as a testbed for culturally aware language generation. We

    introduce CapLocBench, a benchmark of English captions

    localized into five languages, together with bilingual-validated

    contrast pairs designed to isolate pragmatic and cultural meaning loss.

    We evaluate communicative fidelity and target-language localization

    quality separately, revealing limitations of conventional automatic

    translation metrics: the strongest of four evaluated metrics achieves

    only $58.4\%$ tie-adjusted accuracy in distinguishing localized captions

    from pragmatically flattened alternatives. To address this gap, we

    introduce CapLoc, a context-conditioned multilingual model

    trained with pairwise preferences that distinguish faithful localization

    from both literal flattening and unsupported cultural adaptation.

    CapLoc improves the combined human evaluation score from

    0.75 to 0.83 relative to the strongest evaluated baseline, with the

    largest gain in localization quality. Our findings highlight the

    importance of preserving communicative function alongside semantic

    content and identify pragmatic localization as a concrete challenge for

    culturally aware human--AI interaction.'
