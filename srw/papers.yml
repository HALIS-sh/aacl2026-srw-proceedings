- abstract: 'Recent progress in large language models (LLMs) has improved code generation, but their ability
    to coordinate computation across multiple devices remains poorly characterized. As model and workload
    sizes grow, multi-device execution is increasingly common, making multi-device coordination a practical
    and high-impact capability to evaluate. Multi-GPU generation is challenging because it imposes cross-device
    semantic constraints, such as correct work assignment, execution ordering, and data movement, that
    generated code can easily violate. However, most code-generation evaluations focus on single-device
    settings and therefore fail to capture coordination failures specific to multi-device execution. Moreover,
    scalability metrics are rarely integrated with functional correctness in LLM code-generation evaluation,
    making it difficult to identify coordination failures such as incorrect partitioning, missing synchronization,
    and pseudo-parallel multi-GPU execution.


    To address this gap, we introduce two complementary correctness evaluation datasets: a synthesized
    dataset of 23 tasks spanning five domains and a PolyBench/C-derived dataset of 30 tasks. We additionally
    evaluate scalability on two representative workloads. We further provide a diagnostic taxonomy of
    coordination errors and a semi-automatic classification procedure with human verification for pseudo-parallel
    execution, turning a common qualitative failure into a reproducible diagnostic signal. To study these
    failures, we use structured prompts as a probing setup and perform component ablations to analyze
    which coordination constraints most affect model behavior. On our synthesized dataset, structured
    prompting improves correctness across all three models in the main evaluation, including an increase
    from 20/23 to 22/23 correct tasks for ChatGPT-5. Finally, we propose a scalability-aware metric that
    captures both correctness and scaling behavior, revealing that even models achieving high task-level
    correctness may fail to scale efficiently as GPU count increases.'
