- abstract: We present $\textbf{LiLA}$ (Linguistically informed Levenshtein Algorithm), a phonologically
    motivated edit distance metric for Indo-Aryan languages. LiLA extends the classical Levenshtein distance
    by making the substitution costs a function of the features of the phonemes involved. LiLA achieves
    a cophenetic correlation coefficient of 0.942 and a generalized quartet distance of 0.2857 compared
    to the reference phylogeny. A 40 word subsampling with 1000 iterations achieves an average cophenetic
    correlation coefficient and GQD of 0.9137 and 0.2905 respectively. We additionally release the IPA-transcribed
    Swadesh dataset for 14 South Asian languages.
