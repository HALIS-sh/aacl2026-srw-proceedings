- abstract: This paper introduces the technical aspect of a framework for detecting social biases in large
    language model (LLM) training material. The pipeline treats bias not as a single and flattened sentiment
    score but as recurrent linguistic patterns. For each demographic group, the proposed pipeline constructs
    a multidimensional profile. This includes syntactic prominence (Subjecthood), semantic construals
    (Agency, Patienthood, Subjectivity), target-bound evaluative framing (AttI), and contextual embedding
    association (WEAT, CEAT-variants). Finally, an exploratory PCA-based Evaluative Framing Index (EFI)
    summarizes cross-group variation. Preliminary results show that PC1, descriptively labeled contextual
    salience, explains 41.6\% of variance, while PC2 reveals a SI-vs-WEAT opposition at 22.8\%. While
    currently limited to a pilot scale, the pipeline establishes a reproducible foundation for capturing
    bias as a structural linguistic phenomenon.
