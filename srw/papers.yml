- abstract: This paper looks at part-of-speech tagging for code-mixed Korean-English texts using the Panyo
    dataset. The methods used in this research are majority baselines, in-domain perceptrons trained on
    Panyo, and an out-of-domain UD-transfer tagger. The latter was trained on monolingual Universal Dependencies
    corpora. The in-domain perceptrons show near-ceiling agreement with the canonical silver annotations,
    with an accuracy of 99.97\%. In contrast, the UD-transfer tagger achieves 58.00\% accuracy against
    the same silver reference without mapping and 63.16\% using the Panyo-Coarse mapping. Another resource
    used for this research is the adjudicated v1.2 human reference, which includes 180 sentences and 3,186
    tokens. The canonical silver labels agree with this human reference on 64.06\% of tokens. The Conservative-mapped
    UD-transfer tagger has the highest observed human-reference accuracy at 64.63\%, compared with 64.09\%
    for both in-domain perceptrons and 63.40\% for the unmapped UD-transfer tagger. These differences
    are merely descriptive and do not establish statistical superiority. Ablation studies evaluated against
    the silver reference, carried out after the review, reveal that removing direct word-identity features
    has little effect, but removing character affixes as well causes a substantial decrease in accuracy.
    Near-perfect accuracy against the silver reference may reflect the models' ability to reproduce the
    corpus annotation scheme rather than their accuracy against human annotations.
