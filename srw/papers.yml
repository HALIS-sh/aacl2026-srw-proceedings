- abstract: Sarcasm detection is a core problem in natural language processing (NLP), requiring models
    to infer the intended meaning that cannot be captured by lexical mapping. This short paper investigates
    whether large language models (LLMs) perform sarcasm detection better in a fast, intuitive System
    1 prompt or a slower, deliberative System 2 prompt. Using the iSarcasmEval dataset, we compare Zero-Shot
    (System 1) with Zero-Shot-Chain-of-Thought (Zero-Shot-CoT) (System 2) promptings across six LLMs.
    Additionally, we introduce Conservative Prompting, a threshold-based strategy that biases models toward
    non-sarcastic predictions unless strong evidence supports sarcasm. Experimental results show that
    Zero-Shot prompting outperforms Zero-Shot-CoT in accuracy and F1-score, supporting the claim that
    System 1 surpasses System 2 prompts in sarcasm detection. Furthermore, Conservative Prompting significantly
    improves performance by increasing precision and reducing false positives. Together, these findings
    contribute a novel perspective to the sarcasm detection task and promote safer human-computer interaction.
