- abstract: 'Fine-grained rating prediction requires more than recognizing whether a review is positive
    or negative: models must calibrate the ordinal severity of sentiment on a 1-5 scale. Standard in-context
    learning (ICL) demonstration selection typically retrieves examples by textual similarity or diversity,
    ignoring that reviews of the same real-world entity often share implicit rating norms. We study whether
    entity identity can serve as a lightweight calibration signal for frozen LLMs, and how this signal
    interacts with text-based retrieval. We introduce Entity-Proportional ICL (EP-ICL), a controlled two-stage
    selection protocol that allocates demonstration slots between same-entity and cross-entity pools using
    a ratio $\alpha$, then selects examples within each pool by BM25 similarity. Experiments on 50,000
    balanced Yelp reviews with Llama-7B reveal a clear interaction: entity context improves monotonically
    under random sampling, but under BM25 retrieval it follows an inverted-U pattern, with $\alpha{=}0.5$
    achieving the best performance (56.4\% Accuracy and 0.53 MAE). Further analysis shows that the gains
    concentrate on confusable middle ratings (2-3 stars), and that MAE improves more than Accuracy, indicating
    reduced severity of mistakes rather than only more exact matches. These findings suggest that entity
    history and textual similarity provide complementary but partially redundant signals for calibrating
    fine-grained ICL predictions without parameter updates.'
