- abstract: 'Look-alike sound-alike (LASA) drug names are a leading cause of medication errors worldwide.
    However, existing detection systems are calibrated to American English phonology and have not been
    validated for Filipino, the primary language used in Philippine clinical settings. To address this,
    we propose an end-to-end framework targeting two gaps in the literature: the absence of a Filipino
    grapheme-to-phoneme (G2P) system for pharmaceutical brand names, and the English-centric calibration
    of current phonetic similarity algorithms. Our approach fine-tunes a ByT5-based G2P model, preceded
    by a rule-based nativization layer for foreign-origin brand names, and recalibrates the ALINE phonetic
    alignment algorithm to Filipino phonology. We compare a heuristic baseline with logistic regression,
    gradient boosting frameworks (LightGBM, CatBoost, XGBoost), and Mitra, a prior-data fitted network,
    on a new Filipino LASA dataset constructed from the Philippine Food and Drug Administration drug registry.
    The G2P model lowers the phoneme error rate from 5.87% to 3.00%. In preliminary classifier experiments,
    only Mitra and CatBoost exceed the baseline''s area under the precision-recall curve, by at most 0.02,
    and the trained classifiers barely improve on the baseline when separating confusable pairs from hard
    negatives.'
