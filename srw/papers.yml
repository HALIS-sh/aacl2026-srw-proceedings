- abstract: "In the field of automotive component design, the V-model, a process management methodology,\
    \ has been widely adopted by various automotive enterprises. At the initial stage of the model, when\
    \ enterprises obtain customer requirement (CR) documents, system requirement (SR) documents need to\
    \ be derived from them to facilitate subsequent development stages, making this a critical and foundational\
    \ task throughout the V-model development process. With the rapid advancement of large language models\
    \ (LLMs), automatically generating SR documents, rather than relying on non-standardized manual processes,\
    \ has become a promising approach to improving efficiency. However, in real-world enterprise environments,\
    \ several practical challenges remain: (1) CR documents are typically stored in heterogeneous formats,\
    \ and (2) critical factors, including terminology consistency, factual accuracy, data privacy, and\
    \ cost-efficiency trade-offs, must be properly addressed.\nTo comprehensively tackle these challenges,\
    \ this paper presents a Lightweight LLM-based Multi-Agent framework for System Requirement Generation\
    \ (LLMA4SRG). The proposed framework leverages off-the-shelf LLMs with a retrieval-augmented generation\
    \ (RAG) mechanism and consists of two specialized agents: a Requirement Search Agent (RSA), which\
    \ enables efficient retrieval through batch assessment and pre-index caching, and a System Requirement\
    \ Generation Agent (SRGA), which generates customer-specific requirements based on predefined templates.\
    \ \nWe construct a real-world dataset from proprietary automotive projects. Experimental results show\
    \ that embedding-based retrieval improves BLEU-4 by over 150\\% compared to LLM function-call baselines,\
    \ while the end-to-end slot filling success rate reaches 100\\% across all delivered drafts, demonstrating\
    \ strong engineering feasibility for industrial deployment."
