- abstract: In this paper, we introduce Japanese Onomatopoeia Loss Corpus, the first manually curated
    Japanese–English dataset designed to study expressive translation loss in Japanese onomatopoeia. JOLC
    contains 1,307 manually composed Japanese sentences covering 79 commonly used onomatopoeia, each paired
    with an English translation. To quantify how much of the original expressive meaning is weakened during
    translation, we introduce the Expressive Translation Loss Score (ETLS), a five-point scale covering
    sensory, emotional, temporal, pragmatic, and culturally specific meaning. Each instance also includes
    structured linguistic and translation related annotations, supporting predictive modeling and detailed
    analysis of expressive loss. We frame ETLS prediction as sentence-level regression and evaluate XLM-R
    and mBERT under stratified and group splits. Performance is substantially stronger when onomatopoeia
    types overlap between training and test sets, while generalization to unseen types remains difficult,
    suggesting substantial reliance on lexical overlap rather than robust generalization. We therefore
    position JOLC as a diagnostic benchmark for studying expressive translation loss and evaluating unseen
    onomatopoeia.
